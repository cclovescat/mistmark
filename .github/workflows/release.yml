name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.4.3)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        run: |
          version_name="$(perl -ne 'print $1 if /versionName\s*=\s*"([^"]+)"/' app/build.gradle.kts)"
          if [[ "$RELEASE_TAG" != "v$version_name" ]]; then
            echo "Release tag $RELEASE_TAG does not match versionName $version_name" >&2
            exit 1
          fi

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mistmark-release.jks"

      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mistmark-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: mistmark
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Prepare release assets
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          apk="$RUNNER_TEMP/MistMark-${RELEASE_TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd "$RUNNER_TEMP" && sha256sum "MistMark-${RELEASE_TAG#v}.apk" > "MistMark-${RELEASE_TAG#v}.apk.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RUNNER_TEMP/MistMark-${RELEASE_TAG#v}.apk" \
              "$RUNNER_TEMP/MistMark-${RELEASE_TAG#v}.apk.sha256" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$RUNNER_TEMP/MistMark-${RELEASE_TAG#v}.apk" \
              "$RUNNER_TEMP/MistMark-${RELEASE_TAG#v}.apk.sha256" \
              --title "MistMark ${RELEASE_TAG#v}" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
