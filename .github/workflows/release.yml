name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mistmark-release.jks"

      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mistmark-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: mistmark
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Prepare release assets
        run: |
          apk="$RUNNER_TEMP/MistMark-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd "$RUNNER_TEMP" && sha256sum "MistMark-${GITHUB_REF_NAME#v}.apk" > "MistMark-${GITHUB_REF_NAME#v}.apk.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/MistMark-${GITHUB_REF_NAME#v}.apk" \
            "$RUNNER_TEMP/MistMark-${GITHUB_REF_NAME#v}.apk.sha256" \
            --title "MistMark ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest \
            --verify-tag
